<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">DriveIQ architecture</title>
  <desc id="d">A React + TypeScript frontend talks to a FastAPI backend, which uses PostgreSQL 15 with pgvector, optional Qdrant for high-performance vector search, Redis for caching, and a local LLM with sentence-transformers embeddings via Docker Model Runner. RAG runs over the owner's manual and service records.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes fx { 0%,14.00% { offset-distance:0%; opacity:0 } 15.00% {opacity:1} 24.00% { offset-distance:100%; opacity:1 } 26.00%,100% {opacity:0} } .fx { animation:fx 10.0s infinite; offset-path: path('M300 180 L 380 180'); }
    @keyframes g0 { 0%,4.00% { opacity:0; transform:translateY(8px); } 8.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g0 { animation:g0 10.0s infinite; }
    @keyframes g1 { 0%,9.00% { opacity:0; transform:translateY(8px); } 13.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g1 { animation:g1 10.0s infinite; }
    @keyframes g2 { 0%,20.00% { opacity:0; transform:translateY(8px); } 24.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g2 { animation:g2 10.0s infinite; }
    @keyframes g3 { 0%,23.00% { opacity:0; transform:translateY(8px); } 27.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g3 { animation:g3 10.0s infinite; }
    @keyframes g4 { 0%,26.00% { opacity:0; transform:translateY(8px); } 30.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g4 { animation:g4 10.0s infinite; }
    @keyframes g5 { 0%,29.00% { opacity:0; transform:translateY(8px); } 33.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g5 { animation:g5 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="400" rx="20" fill="#0f1420"/>
  <text x="40" y="54" font-size="27" font-weight="800">Full-stack, local-first</text>
  <text x="40" y="80" font-size="14" class="muted">React + FastAPI, with Postgres/pgvector, Qdrant, Redis and a local LLM — your data stays yours.</text>
  <line x1="300" y1="180" x2="380" y2="180" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <line x1="640" y1="180" x2="680" y2="180" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <circle class="fx" r="5" fill="#3ec7ff"/>
  <g class="g0"><rect x="40" y="130" width="260" height="110" rx="12" fill="#3ec7ff" fill-opacity=".08" stroke="#3ec7ff" stroke-width="2"/><text x="60" y="158" font-size="15" font-weight="700">Frontend</text><text x="60" y="182" font-size="11.5" class="mono muted">React 18 · TypeScript · Vite</text><text x="60" y="202" font-size="11.5" class="mono muted">Tailwind · TanStack Query</text><text x="60" y="224" font-size="11" class="muted">dashboard + floating chat</text></g><g class="g1"><rect x="380" y="130" width="260" height="110" rx="12" fill="#009688" fill-opacity=".1" stroke="#009688" stroke-width="2"/><text x="400" y="158" font-size="15" font-weight="700">Backend API</text><text x="400" y="182" font-size="11.5" class="mono muted">FastAPI · Python 3.11+</text><text x="400" y="202" font-size="11.5" class="mono muted">SQLAlchemy · Pydantic</text><text x="400" y="224" font-size="11" class="muted">REST + RAG orchestration</text></g><g class="g2"><rect x="680" y="130" width="240" height="48" rx="10" fill="#336791" fill-opacity=".12" stroke="#336791" stroke-opacity=".6"/><text x="696" y="152" font-size="12.5" font-weight="700">PostgreSQL 15 + pgvector</text><text x="696" y="169" font-size="10" class="muted">records + vectors</text></g><g class="g3"><rect x="680" y="188" width="240" height="48" rx="10" fill="#dc244c" fill-opacity=".12" stroke="#dc244c" stroke-opacity=".6"/><text x="696" y="210" font-size="12.5" font-weight="700">Qdrant</text><text x="696" y="227" font-size="10" class="muted">high-perf vector search</text></g><g class="g4"><rect x="680" y="246" width="240" height="48" rx="10" fill="#ff5c6e" fill-opacity=".12" stroke="#ff5c6e" stroke-opacity=".6"/><text x="696" y="268" font-size="12.5" font-weight="700">Redis</text><text x="696" y="285" font-size="10" class="muted">cache · embeddings · limits</text></g><g class="g5"><rect x="680" y="304" width="240" height="48" rx="10" fill="#b58cff" fill-opacity=".12" stroke="#b58cff" stroke-opacity=".6"/><text x="696" y="326" font-size="12.5" font-weight="700">Local LLM + embeddings</text><text x="696" y="343" font-size="10" class="muted">Docker Model Runner</text></g>
  <text x="40" y="300" font-size="12" class="muted">RAG over the owner's manual, quick-reference guide and your service records · CARFAX import · PostgreSQL schema for maintenance, reminders and receipts.</text>
  <text x="40" y="340" font-size="11.5" class="mono muted">docker compose up — frontend · backend · Postgres · Redis · model runner</text>
</svg>
