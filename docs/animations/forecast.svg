<title id="t">How DriveIQ forecasts the next service</title>
<desc id="d">Animated diagram: an oil change every 5,000 miles or 6 months. As the odometer moves from 40,000 to 45,200 miles, the forecast changes from OK to Due soon at 44,000 miles and to Overdue at 45,000 miles.</desc>
