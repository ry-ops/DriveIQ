<text x="40" y="56" font-size="28" font-weight="800" fill="#f9fafb" text-anchor="start">How the What&#x27;s Next forecast works</text>
<text x="40" y="84" font-size="16" font-weight="400" fill="#9ca3af" text-anchor="start">Each service on your schedule is due after its miles or its months, whichever comes first.</text>
